# The https name for the sign-in gate, on an existing Gateway API Gateway that terminates TLS for
# a home-only domain (a wildcard certificate keeps the name out of Certificate Transparency logs).
# Placeholders: vivint.home.example.com, and the Gateway "home" in namespace "gateway" with
# listeners "https" and "http". Patch them to match your cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vivint
  namespace: vivint
spec:
  parentRefs: [{ name: home, namespace: gateway, sectionName: https }]
  hostnames: [vivint.home.example.com]
  rules:
    - backendRefs: [{ name: vivint, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vivint-redirect
  namespace: vivint
spec:
  parentRefs: [{ name: home, namespace: gateway, sectionName: http }]
  hostnames: [vivint.home.example.com]
  rules:
    - filters: [{ type: RequestRedirect, requestRedirect: { scheme: https, statusCode: 301 } }]
