apiVersion: v1
kind: Secret
metadata:
  name: vivint-bridge-secrets
  namespace: vivint-bridge
type: Opaque
stringData:
  GOOGLE_CLIENT_ID: paste-google-client-id
  GOOGLE_CLIENT_SECRET: paste-google-client-secret
  GOOGLE_AUTH_USER: local-bridge-admin
  GOOGLE_AUTH_PASS: change-me
  STREAM_TOKEN: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: vivint-bridge-cameras
  namespace: vivint-bridge
type: Opaque
stringData:
  settings.json: |
    {
      "cameras": [
        {
          "camera_id": 1,
          "camera_name": "Front Camera",
          "external_rtsp_hd": "rtsp://user:pass@livevid.vivint.com:443/example/8554/Video-1",
          "external_rtsp_sd": "rtsp://user:pass@livevid.vivint.com:443/example/8554/Video-1_SD"
        }
      ]
    }
