apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vivint-bridge
  namespace: vivint-bridge
  annotations:
    external-dns.alpha.kubernetes.io/hostname: bridge.example.com
spec:
  ingressClassName: nginx
  rules:
    - host: bridge.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vivint-bridge
                port:
                  name: http
