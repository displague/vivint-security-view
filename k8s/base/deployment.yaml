apiVersion: apps/v1
kind: Deployment
metadata:
  name: vivint-bridge
  namespace: vivint-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vivint-bridge
  template:
    metadata:
      labels:
        app: vivint-bridge
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: vivint-bridge
          image: replace-me/vivint-google-home-bridge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: vivint-bridge-config
            - secretRef:
                name: vivint-bridge-secrets
          env:
            - name: SETTINGS_FILE
              value: /var/run/vivint-bridge/settings.json
          volumeMounts:
            - name: camera-config
              mountPath: /var/run/vivint-bridge
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: camera-config
          secret:
            secretName: vivint-bridge-cameras
