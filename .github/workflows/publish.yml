name: Release

# Every push to main: lint commit messages, let semantic-release decide whether the commits since
# the last tag make a release (fix -> patch, feat -> minor, BREAKING CHANGE -> major), then build
# the image. Released builds are tagged X.Y.Z, X.Y, X and latest; every build is tagged sha-<short>
# and main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Rebuild the image for an existing release tag (for example v1.2.3) instead of releasing
        required: false
        default: ""

permissions:
  contents: read

env:
  IMAGE_NAME: vivint-security-view

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Lint commit messages
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch or a manual run has no usable "before"; check just the last commit then.
          if [ -z "$FROM" ] || ! git cat-file -e "$FROM^{commit}" 2>/dev/null; then FROM="$TO~1"; fi
          npx commitlint --from "$FROM" --to "$TO" --verbose

  release:
    if: github.event_name != 'pull_request' && !inputs.tag
    needs: commitlint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      # semantic-release created the tag in this checkout, so no fetch is needed.
      - name: Version released on this commit, if any
        id: version
        run: |
          tag=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n1)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "released: ${tag:-none}"

  image:
    needs: release
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.release.result == 'success' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Version to tag
        id: version
        env:
          TAG: ${{ inputs.tag }}
          RELEASED: ${{ needs.release.outputs.version }}
        run: |
          if [ -n "$TAG" ]; then v="${TAG#v}"; else v="$RELEASED"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version: ${v:-none}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=main,enable=${{ !inputs.tag }}
            type=sha,format=short,enable=${{ !inputs.tag }}
          labels: |
            org.opencontainers.image.description=Home-network viewer and always-on HLS ingest for a Vivint panel
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The final stage only copies files, so the arm64 image needs no emulation to build.
      - name: Smoke test (amd64)
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker run --rm --entrypoint ffmpeg "$IMAGE" -hide_banner -protocols | grep -qw rtsp
          docker run --rm --entrypoint ffmpeg "$IMAGE" -hide_banner -muxers | grep -qw hls
          docker run --rm --entrypoint ffmpeg "$IMAGE" -hide_banner -encoders | grep -qw libx264
          docker run -d --name smoke -p 8080:8080 -e APP_MODE=lan "$IMAGE"
          for i in $(seq 30); do curl -fs http://127.0.0.1:8080/healthz > /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/smarthome)" = 404
          docker exec smoke sh -c 'touch /app/streams/.w && rm /app/streams/.w'
          docker rm -f smoke
